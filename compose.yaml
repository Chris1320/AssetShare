---
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetshare123}
      POSTGRES_DB: ${POSTGRES_DB:-assetshare}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - assetshare_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-assetshare} -d ${POSTGRES_DB:-assetshare123}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  assetshare_data:
