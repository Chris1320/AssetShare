---
name: Tests
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      desktop: ${{ steps.filter.outputs.desktop }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check modified paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
                - 'AssetShare-server/**'
                - '.github/workflows/tests.yml'
            desktop:
                - 'AssetShare-desktop/**'
                - '.github/workflows/tests.yml'
            web:
                - 'AssetShare-web/**'
                - '.github/workflows/tests.yml'

  test-server:
    name: Test Server
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AssetShare-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: "AssetShare-server/uv.lock"
          python-version-file: "AssetShare-server/.python-version"

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run pytest --cov=assetshare --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./AssetShare-server/coverage.xml
          flags: server
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./AssetShare-server/junit.xml
          flags: server
          fail_ci_if_error: true

  test-desktop:
    name: Test Desktop
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AssetShare-desktop
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: "AssetShare-desktop/uv.lock"
          python-version-file: "AssetShare-desktop/.python-version"

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --group dev

      - name: Run tests with coverage
        run: uv run pytest --cov=assetshare --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./AssetShare-desktop/coverage.xml
          flags: desktop
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./AssetShare-desktop/junit.xml
          flags: desktop
          fail_ci_if_error: true

  test-web:
    name: Test Web
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AssetShare-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests with coverage
        run: bun run test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./AssetShare-web/coverage/lcov.info
          flags: web
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./AssetShare-web/junit.xml
          flags: web
          fail_ci_if_error: true
