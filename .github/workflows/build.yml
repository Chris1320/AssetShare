---
name: Build
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "AssetShare-desktop/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: AssetShare-desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: "AssetShare-desktop/uv.lock"
          python-version-file: "AssetShare-desktop/.python-version"

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --group dev

      - name: Detect version bump
        id: version_check
        shell: pwsh
        run: |
          $currentVersion = (uv run -q python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          $beforeSha = "${{ github.event.before }}"
          $previousVersion = ""

          if ($beforeSha -and $beforeSha -ne "0000000000000000000000000000000000000000") {
              $oldPyproject = git -C .. show "$beforeSha`:AssetShare-desktop/pyproject.toml" 2>$null

              if ($LASTEXITCODE -eq 0 -and $oldPyproject) {
                  $oldPyproject | Out-File -FilePath old_pyproject.toml -Encoding utf8
                  $previousVersion = (uv run -q python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('old_pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
                  Remove-Item old_pyproject.toml -ErrorAction SilentlyContinue
              }
          }

          $versionBumped = if ("${{ github.event_name }}" -eq "workflow_dispatch" -or ($previousVersion -and $previousVersion -ne $currentVersion)) { "true" } else { "false" }

          "current_version=$currentVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_version=$previousVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_bumped=$versionBumped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build standalone package
        if: steps.version_check.outputs.version_bumped == 'true'
        shell: pwsh
        run: ./scripts/build.ps1 nuitka

      - name: Generate release notes
        if: steps.version_check.outputs.version_bumped == 'true'
        shell: pwsh
        run: |
          $beforeSha = "${{ github.event.before }}"
          $releaseNotes = "release-notes.md"

          "## Changes" | Out-File -FilePath $releaseNotes -Encoding utf8
          "" | Out-File -FilePath $releaseNotes -Append -Encoding utf8

          if ($beforeSha -and $beforeSha -ne "0000000000000000000000000000000000000000") {
              git -C .. log --pretty=format:"- %h %s" "$beforeSha..${{ github.sha }}" -- AssetShare-desktop | Out-File -FilePath $releaseNotes -Append -Encoding utf8
          }
          else {
              "- Initial release from automated workflow." | Out-File -FilePath $releaseNotes -Append -Encoding utf8
          }

      - name: Create GitHub release
        if: steps.version_check.outputs.version_bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version_check.outputs.current_version }}
          tag_name: v${{ steps.version_check.outputs.current_version }}
          body_path: AssetShare-desktop/release-notes.md
          files: AssetShare-desktop/dist/assetshare-desktop-v${{ steps.version_check.outputs.current_version }}-windows.zip
