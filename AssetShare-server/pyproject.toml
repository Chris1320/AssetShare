[project]
name = "assetshare"
version = "0.1.0"
description = "Multi-user Digital Asset Management System"
readme = "README.md"
authors = [{ name = "Chris1320", email = "me@chrisfromnowhere.me" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.50",
]

[project.scripts]
assetshare = "assetshare:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.isort]
profile = "black"

[tool.pylint."messages control"]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
]
