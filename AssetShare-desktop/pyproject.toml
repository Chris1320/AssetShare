[project]
name = "assetshare-desktop"
version = "0.1.0"
description = "Multi-user Digital Asset Management System"
readme = "README.md"
authors = [{ name = "Chris1320", email = "me@chrisfromnowhere.me" }]
requires-python = ">=3.15"
dependencies = [
    "loguru>=0.7.3",
    "pyside6>=6.12.0",
]

[project.scripts]
assetshare = "assetshare:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "nuitka>=4.3.5",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.build-backend]
module-name = "assetshare"

[tool.isort]
profile = "black"

[tool.pylint.typecheck]
ignored-modules = ["PySide6"]

[tool.pylint."messages control"]
disable = [
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring
]
